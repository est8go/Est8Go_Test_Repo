services:
  # Main FastAPI Web Service
  - type: web
    name: est8go-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_NAME
        value: Est8Go Service Limited
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PUBLIC_API_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true

  # Reminder Worker (Background Process)
  - type: worker
    name: est8go-reminder-worker
    runtime: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python run_reminders.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # Hourly Reminder Cron Job
  - type: cron
    name: est8go-reminder-cron
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 * * * *"
    startCommand: python run_reminders_once.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # 15-Minute Platform Health Monitor
  - type: cron
    name: est8go-health-cron
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "*/15 * * * *"
    startCommand: python run_health_check.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: BASE_URL
        sync: false

  # Daily MMEF Compliance Check (1am UTC)
  - type: cron
    name: est8go-mmef-cron
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 1 * * *"
    startCommand: python run_mmef_check.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: BASE_URL
        sync: false

  # Daily Data Retention Job (2am UTC)
  - type: cron
    name: est8go-retention-cron
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 2 * * *"
    startCommand: python run_retention.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
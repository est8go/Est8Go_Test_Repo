services:
  # Main FastAPI Web Service
  - type: web
    name: est8go-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_NAME
        value: Est8Go Service Limited
      - key: DATABASE_URL
        sync: false
      # JWT signing key. app/core/security.py raises at import if unset.
      # (Replaces JWT_SECRET, which no code path reads any more.)
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      # Public property/vault pages fall back to this when a tenant has no
      # WhatsApp number of its own (app/public/router.py).
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PUBLIC_API_KEY
        sync: false
      # Fernet key for tenant WhatsApp credentials (app/core/crypto.py).
      - key: ENCRYPTION_KEY
        sync: false
      # Paystack: also used as the HMAC key for webhook signature checks.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # Transactional email (Resend).
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      # Absolute base URL used to build links in outbound email.
      - key: BASE_URL
        sync: false
      # Health-monitor escalation recipient (app/services/health_service.py).
      - key: SUPERADMIN_EMAIL
        sync: false
      # Reserved for authenticating internal cron/webhook calls. NOTE: no
      # code path reads this yet - declared here so the value set on Render
      # is documented rather than orphaned.
      - key: INTERNAL_CRON_KEY
        sync: false
      # NOT declared, deliberately - no code path reads them:
      #   JWT_SECRET, JWT_ALGORITHM, WHATSAPP_VERIFY_TOKEN,
      #   PAYSTACK_PUBLIC_KEY, PAYSTACK_WEBHOOK_SECRET
    healthCheckPath: /
    autoDeploy: true

  # DISABLED: duplicate scheduler — cron is the single runner for recovery (Audit #8)
  # The hourly cron (run_reminders_once.py) is the sole recovery runner.
  # This long-running worker (while True + sleep) double-fired recovery.
  # Re-enable ONLY if the cron is removed — never both at once.
  # - type: worker
  #   name: est8go-reminder-worker
  #   runtime: python
  #   rootDir: backend
  #   buildCommand: chmod +x build.sh && ./build.sh
  #   startCommand: python run_reminders.py
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: 3.11.0
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: WHATSAPP_ACCESS_TOKEN
  #       sync: false
  #     - key: WHATSAPP_PHONE_ID
  #       sync: false
  #     - key: SUPABASE_URL
  #       sync: false
  #     - key: SUPABASE_KEY
  #       sync: false
  #     - key: ENCRYPTION_KEY
  #       sync: false

  # Hourly Reminder Cron Job
  - type: cron
    name: est8go-reminder-cron
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 * * * *"
    startCommand: python run_reminders_once.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      # KILL SWITCH. recovery_engine.py no-ops unless this is exactly "true"
      # (case-insensitive). This is why the engine has never sent a message.
      - key: RECOVERY_ENABLED
        value: "false"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  # 15-Minute Platform Health Monitor
  - type: cron
    name: est8go-health-cron
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "*/15 * * * *"
    startCommand: python run_health_check.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: BASE_URL
        sync: false

  # Daily MMEF Compliance Check (1am UTC)
  - type: cron
    name: est8go-mmef-cron
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 1 * * *"
    startCommand: python run_mmef_check.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: BASE_URL
        sync: false

  # Daily Data Retention Job (2am UTC)
  - type: cron
    name: est8go-retention-cron
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 2 * * *"
    startCommand: python run_retention.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false

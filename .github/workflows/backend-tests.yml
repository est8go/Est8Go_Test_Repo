name: Backend tests

# This workflow is the merge gate for backend changes.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: est8go_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d est8go_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/est8go_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/est8go_test
      SECRET_KEY: ci-test-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run complete backend test suite
        # Keep imports stable even though GitHub Actions starts commands at the
        # repository root while the Python package lives in backend/app.
        run: PYTHONPATH=backend pytest backend/tests -q

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4338ca">
  <title>Sign in | Est8Go</title>
  <link rel="stylesheet" href="/static/mvp-dashboard.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><span class="brand-mark">e</span><span>Est8Go</span></div>
    <h1>Welcome back.</h1>
    <p>Sign in to your agency workspace. Your account determines which agency records you can access.</p>
    <form id="login-form">
      <label class="field">Email<input required autocomplete="username" name="username" type="email" placeholder="name@agency.com"></label>
      <label class="field">Password<input required autocomplete="current-password" name="password" type="password" placeholder="Your password"></label>
      <button class="submit" type="submit">Sign in</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#login-form'), error = document.querySelector('#error');
    if (localStorage.getItem('access_token') && localStorage.getItem('tenant_id')) location.replace('/public/business');
    form.addEventListener('submit', async event => {
      event.preventDefault(); error.textContent = ''; const button = form.querySelector('button'); button.disabled = true; button.textContent = 'Signing in…';
      try {
        const data = new FormData(form);
        const response = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(data) });
        const result = await response.json().catch(()=>({}));
        if (!response.ok) throw new Error(result.detail || 'Sign-in failed. Please check your details.');
        if (!result.tenant_id) throw new Error('This dashboard needs an agency staff account. Please sign in with your agency account.');
        localStorage.setItem('access_token', result.access_token); localStorage.setItem('tenant_id', result.tenant_id); localStorage.setItem('user_role', result.role || '');
        location.replace('/public/business');
      } catch (err) { error.textContent = err.message; button.disabled = false; button.textContent = 'Sign in'; }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#030617" />
    <title>Est8Go | Secure Access</title>
    <script>/* Tailwind via CDN - replace with CLI build for production */</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --navy: #030617;
            --navy2: #0E1B40;
            --em: #10B981;
            --em-dim: rgba(16, 185, 129, 0.10);
            --em-glow: rgba(16, 185, 129, 0.22);
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--navy);
            color: white;
            overflow: hidden;
        }

        /* ── BACKGROUND GRID ── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(16, 185, 129, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(14, 27, 64, 0.9) 0%, transparent 60%),
                var(--navy);
        }

        .grid-lines {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(16, 185, 129, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        /* ── CARD ── */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(14, 27, 64, 0.7);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 44px 40px 40px;
            box-shadow: 0 0 80px rgba(16, 185, 129, 0.06), 0 40px 80px rgba(0, 0, 0, 0.5);
        }

        /* ── LOGO ── */
        .logo-wrap {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -2px;
            color: white;
            line-height: 1;
        }

        .logo span {
            color: var(--em);
        }

        .tagline {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.35em;
            color: rgba(16, 185, 129, 0.7);
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* ── TRUST BADGE ── */
        .trust-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--em-dim);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 100px;
            padding: 5px 14px;
            font-size: 10px;
            font-weight: 600;
            color: var(--em);
            letter-spacing: 0.05em;
            margin-bottom: 28px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--em);
            box-shadow: 0 0 8px var(--em);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ── LABELS ── */
        .field-label {
            display: block;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        /* ── INPUTS ── */
        .input-wrap {
            position: relative;
            margin-bottom: 18px;
        }

        .input-wrap svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.25);
            pointer-events: none;
            width: 16px;
            height: 16px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px 44px 15px 44px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: white;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        input[type="email"] {
            padding-right: 16px !important;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: rgba(16, 185, 129, 0.5);
            background: rgba(16, 185, 129, 0.04);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ── TOGGLE PASSWORD ── */
        .toggle-pw {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.25);
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-pw:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ── SUBMIT BUTTON ── */
        .btn {
            width: 100%;
            background: var(--em);
            color: var(--navy);
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            box-shadow: 0 0 32px var(--em-glow);
            filter: brightness(1.08);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            filter: none;
        }

        /* ── ERROR BOX ── */
        .error-box {
            background: rgba(255, 64, 96, 0.08);
            border: 1px solid rgba(255, 64, 96, 0.25);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 12px;
            color: #FF6080;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-box.show {
            display: flex;
        }

        /* ── SPINNER ── */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--navy);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── FOOTER ── */
        .footer-note {
            text-align: center;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 32px;
        }

        /* ── ENTRY ANIMATION ── */
        .card {
            animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── DIVIDER ── */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 28px 0;
        }
    </style>
</head>

<body class="flex items-center justify-center p-6">

    <div class="bg"></div>
    <div class="grid-lines"></div>

    <div class="card">

        <!-- LOGO -->
        <div class="logo-wrap">
            <div class="logo">Est<span>8</span>Go</div>
            <div class="tagline">Truth as a Service</div>
        </div>

        <!-- TRUST BADGE -->
        <div style="text-align:center">
            <span class="trust-badge">
                <span class="badge-dot"></span>
                Secured Access Portal
            </span>
        </div>

        <!-- ERROR BOX -->
        <div class="error-box" id="errorBox">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span id="errorMsg">Invalid credentials. Access denied.</span>
        </div>

        <!-- FORM -->
        <form id="loginForm" autocomplete="on">

            <label class="field-label" for="email">Email Address</label>
            <div class="input-wrap">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                </svg>
                <input type="email" id="email" placeholder="you@company.com" required autocomplete="email" />
            </div>

            <label class="field-label" for="password">Access Key</label>
            <div class="input-wrap">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
                <input type="password" id="password" placeholder="••••••••••••" required
                    autocomplete="current-password" />
                <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
                    <svg id="eyeIcon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>

            <button type="submit" class="btn" id="loginBtn">Authenticate</button>

        </form>

        <hr class="divider" />

        <div class="footer-note">Protected by Est8Go Security Protocol · v2.0</div>

    </div>

    <script>
        // ── AUTH GATE: redirect if already logged in ──
        (function () {
            const token = localStorage.getItem('access_token');
            const role = localStorage.getItem('user_role');
            if (token) {
                if (role === 'superuser') {
                    window.location.href = '/public/super-admin-portal';
                } else {
                    window.location.href = '/public/realtor-portal';
                }
            }
        })();

        // ── TOGGLE PASSWORD VISIBILITY ──
        (function () {
            const btn = document.getElementById('togglePw');
            const field = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            let visible = false;

            const EYE_OPEN = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>';
            const EYE_SHUT = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>';

            btn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                visible = !visible;
                field.type = visible ? 'text' : 'password';
                icon.innerHTML = visible ? EYE_SHUT : EYE_OPEN;
                btn.style.color = visible ? 'rgba(16,185,129,0.9)' : 'rgba(255,255,255,0.25)';
                field.focus();
            });
        })();

        // ── SHOW ERROR ──
        function showError(msg, borderColor) {
            const box = document.getElementById('errorBox');
            document.getElementById('errorMsg').textContent = msg;
            if (borderColor) box.style.borderColor = borderColor;
            box.classList.add('show');
        }
        function hideError() {
            document.getElementById('errorBox').classList.remove('show');
        }

        // ── LOGIN SUBMIT ──
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideError();

            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="spinner"></span>Verifying...';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);

                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const data = await res.json();

                if (res.ok) {
                    // Save token and user info
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_role', data.role || '');
                    localStorage.setItem('tenant_id', data.tenant_id || '');
                    localStorage.setItem('user_email', email);

                    btn.innerHTML = '✓ Access Granted';
                    btn.style.background = '#10B981';

                    // Role-based redirect
                    setTimeout(() => {
                        if (data.role === 'superuser' || data.is_superuser) {
                            window.location.href = '/public/super-admin-portal';
                        } else {
                            window.location.href = '/public/realtor-portal';
                        }
                    }, 600);

                } else {
                    const detail = data.detail || 'Invalid credentials. Access denied.';
                    // Style lockout differently
                    if (res.status === 429) {
                        showError('🔒 ' + detail, '#FF6080');
                        btn.innerHTML = 'Account Locked';
                        btn.style.background = 'rgba(255,64,96,0.3)';
                    } else {
                        showError(detail);
                        btn.innerHTML = 'Authenticate';
                        btn.disabled = false;
                    }
                }

            } catch (err) {
                showError('Connection failed. Please check your network and try again.');
                btn.innerHTML = 'Authenticate';
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>

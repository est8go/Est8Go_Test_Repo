<!DOCTYPE html>
<html lang="en" data-require-superuser="true"> <!-- ADD data-require-superuser -->

<head>
    <script src="/static/js/auth_guard.js"></script> <!-- ADD THIS LINE -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Est8Go | Super Admin Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .sidebar-active {
            background: #1e293b;
            border-left: 4px solid #38bdf8;
            color: white;
        }
    </style>
</head>

<body class="bg-slate-50 flex h-screen overflow-hidden">

    <!-- 1. SIDEBAR (Desktop) -->
    <aside class="hidden lg:flex flex-col w-64 bg-slate-900 text-slate-400 h-full p-6 shadow-2xl">
        <div class="mb-10 px-2">
            <h1 class="text-xl font-black text-white tracking-tighter italic">EST8GO <span
                    class="text-blue-400">ADMIN</span></h1>
        </div>

        <!-- 1. SIDEBAR (Now Desktop Only) -->
        <aside
            class="hidden lg:flex flex-col w-64 bg-slate-900 text-slate-400 h-full p-6 shadow-2xl fixed left-0 top-0">
            <div class="mb-10 px-2">
                <h1 class="text-xl font-black text-white tracking-tighter italic">EST8GO <span
                        class="text-blue-400">ADMIN</span></h1>
            </div>

            <nav class="space-y-2 flex-1">
                <button onclick="AdminPortal.switchTab('overview')" id="btn-overview"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition hover:text-white sidebar-active">
                    <i class="fa-solid fa-gauge-high"></i> <span class="text-sm font-bold">Overview</span>
                </button>
                <button onclick="AdminPortal.switchTab('listings')" id="btn-listings"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition hover:text-white">
                    <i class="fa-solid fa-shield-check"></i> <span class="text-sm font-bold">Truth Monitor</span>
                </button>
                <button onclick="AdminPortal.switchTab('tenants')" id="btn-tenants"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition hover:text-white">
                    <i class="fa-solid fa-building-user"></i> <span class="text-sm font-bold">Tenant Vault</span>
                </button>
            </nav>
        </aside>

        <nav class="space-y-2 flex-1">
            <button onclick="AdminPortal.switchTab('overview')" id="btn-overview"
                class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition hover:text-white sidebar-active">
                <i class="fa-solid fa-gauge-high"></i> <span class="text-sm font-bold">Overview</span>
            </button>
            <button onclick="AdminPortal.switchTab('listings')" id="btn-listings"
                class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition hover:text-white">
                <i class="fa-solid fa-shield-check"></i> <span class="text-sm font-bold">Truth Monitor</span>
            </button>
            <button onclick="AdminPortal.switchTab('tenants')" id="btn-tenants"
                class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition hover:text-white">
                <i class="fa-solid fa-building-user"></i> <span class="text-sm font-bold">Tenant Vault</span>
            </button>
        </nav>

        <div class="pt-6 border-t border-slate-800">
            <p id="adminName" class="text-xs font-bold text-slate-500 uppercase px-2 mb-4">Master Admin</p>
            <button class="text-red-400 text-xs font-bold px-2 hover:text-red-300">LOGOUT SYSTEM</button>
        </div>
    </aside>

    <!-- 2. MAIN CONTENT -->
    <main class="flex-1 h-full overflow-y-auto lg:ml-64 pb-24 lg:pb-8">

        <!-- Header -->
        <header
            class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-slate-200 px-8 py-4 flex justify-between items-center z-10">
            <h2 id="currentTabTitle" class="text-lg font-black text-slate-800 uppercase tracking-tight">System Overview
            </h2>
            <div class="flex gap-4">
                <button onclick="AdminPortal.refreshData()" class="p-2 text-slate-400 hover:text-blue-600 transition"><i
                        class="fa-solid fa-rotate"></i></button>
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold">A
                </div>
            </div>
        </header>

        <div class="p-8">
            <!-- OVERVIEW TAB -->
            <div id="tab-overview" class="tab-content">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Listings</p>
                        <h3 id="stat-listings" class="text-3xl font-black text-slate-800">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Tenants</p>
                        <h3 id="stat-tenants" class="text-3xl font-black text-slate-800">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Live Users</p>
                        <h3 id="stat-users" class="text-3xl font-black text-slate-800">0</h3>
                    </div>
                    <div class="bg-amber-500 p-6 rounded-3xl shadow-lg border border-amber-400">
                        <p class="text-[10px] font-black text-amber-100 uppercase mb-1 text-right">Pending Audit</p>
                        <h3 id="stat-pending" class="text-3xl font-black text-white text-right">0</h3>
                    </div>
                </div>
            </div>

            <!-- LISTINGS TAB (Table View) -->
            <div id="tab-listings" class="tab-content hidden">
                <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="p-4 text-xs font-black text-slate-500 uppercase">Property Details</th>
                                <th class="p-4 text-xs font-black text-slate-500 uppercase">Realtor</th>
                                <th class="p-4 text-xs font-black text-slate-500 uppercase text-center">Truth Score</th>
                                <th class="p-4 text-xs font-black text-slate-500 uppercase text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="listingsTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- TENANTS TAB -->
            <div id="tab-tenants" class="tab-content hidden">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="tenantGrid"></div>
            </div>
        </div>
    </main>

    <!-- Modular JS -->
    <script src="/static/js/admin_portal.js?v=1.0.0" type="module"></script>
    <!-- 2. MOBILE BOTTOM NAVIGATION (Phone Only) -->
    <div
        class="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900 text-slate-400 px-6 py-4 flex justify-between items-center z-[100] border-t border-slate-800 rounded-t-[2rem] shadow-2xl">
        <button onclick="AdminPortal.switchTab('overview')"
            class="flex flex-col items-center gap-1 hover:text-blue-400 transition">
            <i class="fa-solid fa-gauge-high text-lg"></i>
            <span class="text-[9px] font-black uppercase">Home</span>
        </button>
        <button onclick="AdminPortal.switchTab('listings')"
            class="flex flex-col items-center gap-1 hover:text-blue-400 transition">
            <i class="fa-solid fa-shield-check text-lg"></i>
            <span class="text-[9px] font-black uppercase">Truth</span>
        </button>
        <button onclick="AdminPortal.switchTab('tenants')"
            class="flex flex-col items-center gap-1 hover:text-blue-400 transition">
            <i class="fa-solid fa-building-user text-lg"></i>
            <span class="text-[9px] font-black uppercase">Tenants</span>
        </button>
    </div>
</body>

</html>

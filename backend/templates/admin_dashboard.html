<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Est8Go | Super Admin Truth Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .trust-pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-gray-100 pb-20">

    <!-- Top Navigation -->
    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-green-500 rounded-full trust-pulse"></div>
                <h1 class="text-lg font-bold tracking-tight">EST8GO <span class="text-blue-400">TRUTH</span></h1>
            </div>
            <div class="text-xs bg-slate-800 px-2 py-1 rounded border border-slate-700">
                Super Admin
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto p-4 lg:p-8">

        <!-- Stats Summary Section -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                <p class="text-gray-500 text-xs uppercase font-bold">Total Listings</p>
                <h3 id="totalCount" class="text-2xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                <p class="text-gray-500 text-xs uppercase font-bold">Avg. Trust</p>
                <h3 id="avgTrust" class="text-2xl font-black text-blue-600">0%</h3>
            </div>
        </div>

        <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
            🛡️ Live Audit Stream
        </h2>

        <!-- Desktop Table View (Hidden on Mobile) -->
        <div class="hidden md:block bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="p-4 text-xs font-bold text-gray-500 uppercase">Property</th>
                        <th class="p-4 text-xs font-bold text-gray-500 uppercase text-center">Truth Score</th>
                        <th class="p-4 text-xs font-bold text-gray-500 uppercase">Location</th>
                        <th class="p-4 text-xs font-bold text-gray-500 uppercase">Verification</th>
                    </tr>
                </thead>
                <tbody id="desktopBody">
                    <!-- Data injected here -->
                </tbody>
            </table>
        </div>

        <!-- Mobile Card View (Visible only on Mobile) -->
        <div id="mobileCards" class="md:hidden space-y-4">
            <!-- Data cards injected here -->
            <div class="text-center py-10 text-gray-400">Loading platform data...</div>
        </div>

    </main>

    <!-- Script to fetch and render data -->
    <script>
        async function refreshDashboard() {
            try {
                // Change URL to match your Render deployment
                const response = await fetch('/admin/trust-monitor', {
                    headers: { 'X-Tenant-Id': '1' }
                });
                const data = await response.json();

                if (data.error) {
                    alert("Unauthorized access");
                    return;
                }

                // Update Stats
                document.getElementById('totalCount').innerText = data.length;
                const totalScore = data.reduce((acc, curr) => acc + curr.trust_score, 0);
                document.getElementById('avgTrust').innerText = Math.round(totalScore / data.length) + "%";

                // Render Desktop Table
                const desktopBody = document.getElementById('desktopBody');
                desktopBody.innerHTML = data.map(item => `
                    <tr class="border-b border-gray-100 hover:bg-blue-50 transition">
                        <td class="p-4">
                            <div class="font-bold text-slate-800">${item.title}</div>
                            <div class="text-xs text-gray-500">ID: #${item.id}</div>
                        </td>
                        <td class="p-4 text-center">
                            <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase bg-${item.status_color}-100 text-${item.status_color}-700 border border-${item.status_color}-200">
                                ${item.trust_score}% ${item.status_text}
                            </span>
                        </td>
                        <td class="p-4 text-sm text-gray-600">${item.location}</td>
                        <td class="p-4 text-sm font-semibold">${item.gps_verified ? '✅ GPS ON-SITE' : '⚠️ MANUAL ENTRY'}</td>
                    </tr>
                `).join('');

                // Render Mobile Cards
                const mobileCards = document.getElementById('mobileCards');
                mobileCards.innerHTML = data.map(item => `
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-200">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-bold text-slate-800 leading-tight">${item.title}</h3>
                                <p class="text-xs text-gray-500">${item.location}</p>
                            </div>
                            <div class="text-right">
                                <div class="text-lg font-black text-${item.status_color}-600">${item.trust_score}%</div>
                                <div class="text-[10px] uppercase font-bold text-gray-400">${item.status_text}</div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-50">
                            <span class="text-xs font-bold ${item.gps_verified ? 'text-green-600' : 'text-orange-500'}">
                                ${item.gps_verified ? '📍 GPS Verified' : '❓ Unverified Location'}
                            </span>
                            <button class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-2 rounded-xl">View Audit</button>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Dashboard error:", err);
            }
        }

        // Auto-refresh every 30 seconds
        refreshDashboard();
        setInterval(refreshDashboard, 30000);
    </script>
</body>

</html>

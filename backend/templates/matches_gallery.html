<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Est8Go | Verified Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
        }

        .premium-gradient {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }

        .swiper {
            width: 100%;
            height: 85vh;
            padding-top: 20px;
        }

        .swiper-slide {
            background-position: center;
            background-size: cover;
            width: 300px;
        }
    </style>
</head>

<body class="overflow-hidden">

    <nav class="p-6 flex justify-between items-center border-b border-white/5">
        <h1 class="text-xl font-black text-white italic">EST8GO <span class="text-indigo-400">TRUTH</span></h1>
        <div class="bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
            <span class="text-[10px] font-black text-emerald-400 uppercase">Live Vault</span>
        </div>
    </nav>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            {% for item in listings %}
            <div class="swiper-slide rounded-[2.5rem] overflow-hidden border border-white/10 shadow-2xl bg-slate-900">
                <img src="{{ item.images[0].url if item.images else 'https://images.unsplash.com/photo-1560518883-ce09059eeffa' }}"
                    class="w-full h-1/2 object-cover">
                <div class="p-6">
                    <h2 class="text-xl font-black text-white mb-1">{{ item.title }}</h2>
                    <p class="text-indigo-300 text-xs font-bold mb-4 uppercase tracking-tighter">{{ item.location }}</p>
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-emerald-400 font-black text-lg">₦{{ "{:,}".format(item.price) }}</span>
                        <span
                            class="bg-white/5 px-3 py-1 rounded-lg text-[10px] font-bold text-slate-400">Verified</span>
                    </div>
                    <a href="https://wa.me/2348000000000?text=I want to buy: {{ item.title }}"
                        class="block w-full premium-gradient text-white text-center py-4 rounded-2xl font-black shadow-lg">CHAT
                        TO BUY</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper(".mySwiper", {
            effect: "cards",
            grabCursor: true,
            rotate: true,
            slideShadows: true,
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Est8Go | Realtor Executive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .premium-gradient {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }

        /* THE SPILLOVER KILLER: Hard truncation */
        .force-truncate {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] pb-24">

    <nav class="premium-gradient text-white pt-6 pb-10 px-6 rounded-b-[2.5rem] shadow-2xl sticky top-0 z-50">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-[9px] font-extrabold uppercase tracking-widest text-indigo-300 mb-1">Realtor Executive
                </p>
                <h1 class="text-xl font-black">Est8Go <span class="text-indigo-400">Portal</span></h1>
            </div>
            <div class="bg-white/10 p-3 rounded-2xl border border-white/10">
                <i class="fa-solid fa-bell"></i>
            </div>
        </div>
    </nav>

    <div class="px-6 -mt-6 relative z-50">
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-[2rem] shadow-xl border border-white">
                <p class="text-[8px] font-black text-slate-400 uppercase">Leads</p>
                <h3 id="statCount" class="text-2xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-emerald-500 p-4 rounded-[2rem] shadow-xl border-emerald-400">
                <p class="text-[8px] font-black text-emerald-100 uppercase">Hot</p>
                <h3 id="statHot" class="text-2xl font-black text-white">0</h3>
            </div>
        </div>
    </div>

    <main class="px-6 mt-8">
        <div id="leadList" class="space-y-4">
            <div class="text-center py-20 text-slate-300 font-bold italic">Syncing live data...</div>
        </div>
    </main>

    <script>
        const TENANT_ID = "1";

        async function loadLeads() {
            try {
                const response = await fetch('/conversations/realtor/leads', {
                    headers: { 'X-Tenant-Id': TENANT_ID }
                });
                const data = await response.json();

                document.getElementById('statCount').innerText = data.length;
                document.getElementById('statHot').innerText = data.filter(l => l.status === 'HOT LEAD').length;

                const list = document.getElementById('leadList');
                let html = "";

                data.forEach(lead => {
                    // --- STEP 1: DEEP DATA CLEANING (Prevents 'undefined') ---
                    const name = lead.name || "Anonymous";
                    const lastActive = lead.last_active || "Just now";

                    // Safely check for nested prefs
                    const prefs = lead.prefs || {};
                    const loc = (prefs.location && prefs.location !== "undefined") ? prefs.location : "Exploring";
                    const budget = (prefs.budget && prefs.budget !== "undefined") ? '₦' + Number(prefs.budget).toLocaleString() : "Negotiable";

                    const isHot = lead.status === 'HOT LEAD';
                    const botLabel = lead.is_bot_active ? 'Takeover' : 'Controlled';
                    const botClass = lead.is_bot_active ? 'bg-slate-900' : 'bg-emerald-500';

                    html += `
                    <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-12 h-12 shrink-0 premium-gradient rounded-2xl flex items-center justify-center text-white font-black shadow-md">
                                ${name.charAt(0)}
                            </div>
                            <div class="min-w-0 flex-1">
                                <h3 class="text-sm font-black text-slate-800 force-truncate">${name}</h3>
                                <p class="text-[9px] text-slate-400 font-bold uppercase">${lastActive}</p>
                            </div>
                            ${isHot ? '<span class="bg-orange-100 text-orange-600 text-[8px] font-black px-2 py-1 rounded-lg uppercase">Hot</span>' : ''}
                        </div>

                        <!-- FORCED 50/50 SPLIT BOX -->
                        <div class="bg-[#F8FAFC] rounded-2xl p-3 mb-4 flex w-full border border-slate-50">
                            <div class="w-1/2 border-r border-slate-200 pr-2 min-w-0">
                                <p class="text-[7px] font-black text-slate-400 uppercase mb-0.5">Searching</p>
                                <p class="text-[10px] font-bold text-indigo-900 force-truncate">${loc}</p>
                            </div>
                            <div class="w-1/2 pl-2 min-w-0">
                                <p class="text-[7px] font-black text-slate-400 uppercase mb-0.5 text-right">Budget</p>
                                <p class="text-[10px] font-black text-emerald-600 text-right force-truncate">${budget}</p>
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <a href="tel:${lead.phone}" class="flex-1 bg-indigo-50 text-indigo-600 py-3 rounded-xl text-center active:scale-95 transition">
                                <i class="fa-solid fa-phone text-xs"></i>
                            </a>
                            <a href="https://wa.me/${lead.phone}" class="flex-1 bg-emerald-50 text-emerald-600 py-3 rounded-xl text-center active:scale-95 transition">
                                <i class="fa-brands fa-whatsapp text-sm"></i>
                            </a>
                            <button onclick="takeover('${lead.phone}')" class="flex-[1.5] ${botClass} text-white text-[8px] font-black py-3 rounded-xl uppercase active:scale-95 transition">
                                ${botLabel}
                            </button>
                        </div>
                    </div>`;
                });
                list.innerHTML = html || '<div class="text-center py-20 text-slate-300 font-bold">No leads found.</div>';
            } catch (err) {
                console.error("Dashboard Sync Error:", err);
            }
        }

        async function takeover(phone) {
            if (!confirm("Silence the AI for this client?")) return;
            const res = await fetch('/conversations/takeover/' + phone, {
                method: 'POST',
                headers: { 'X-Tenant-Id': TENANT_ID }
            });
            if (res.ok) loadLeads();
        }

        loadLeads();
        setInterval(loadLeads, 20000); 
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Est8Go | Realtor Executive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC;
        }

        .premium-gradient {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .force-truncate {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
    </style>
</head>

<body class="pb-24">

    <!-- Header -->
    <nav class="premium-gradient text-white pt-8 pb-14 px-6 rounded-b-[3rem] shadow-2xl sticky top-0 z-50">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-[10px] font-extrabold uppercase tracking-widest text-indigo-300 mb-1">Realtor Portal</p>
                <h1 class="text-2xl font-black italic">Est8Go</h1>
            </div>
            <div class="bg-white/10 p-3 rounded-2xl border border-white/10"><i class="fa-solid fa-shield-halved"></i>
            </div>
        </div>
    </nav>

    <!-- Stats -->
    <div class="px-6 -mt-10 relative z-50">
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-white">
                <p class="text-[9px] font-black text-slate-400 uppercase">My Leads</p>
                <h3 id="statCount" class="text-3xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-emerald-500 p-6 rounded-[2.5rem] shadow-xl border-emerald-400">
                <p class="text-[9px] font-black text-emerald-100 uppercase">Ready Deals</p>
                <h3 id="statHot" class="text-3xl font-black text-white">0</h3>
            </div>
        </div>
    </div>

    <!-- Leads Container -->
    <main class="px-6 mt-10">
        <h2 class="text-lg font-black text-slate-800 mb-6">Live Pipeline</h2>
        <div id="leadList" class="space-y-4"></div>
    </main>

    <!-- FULL PROPERTY UPLOAD MODAL -->
    <div id="uploadModal" class="fixed inset-0 z-[200] hidden bg-slate-900/98 backdrop-blur-xl flex flex-col">
        <nav class="p-8 flex justify-between items-center text-white">
            <h2 class="text-2xl font-black">List <span class="text-emerald-400">Property</span></h2>
            <button id="closeModal" class="text-4xl text-white/30 hover:text-white">&times;</button>
        </nav>

        <div class="flex-1 overflow-y-auto px-8 pb-32">
            <form id="uploadForm" class="space-y-6">
                <!-- GPS Section (Fixed Contrast) -->
                <div class="bg-black/20 p-6 rounded-[2rem] border border-white/5 text-center">
                    <p class="text-[10px] font-black text-indigo-300 uppercase mb-4 tracking-[0.2em]">Mandatory Site
                        Presence</p>
                    <button type="button" id="gpsBtn"
                        class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black shadow-lg">CAPTURE SITE
                        GPS</button>
                    <input type="hidden" id="latitude" name="latitude">
                    <input type="hidden" id="longitude" name="longitude">
                </div>

                <!-- Details (Added Labels and Better Contrast) -->
                <div class="space-y-4">
                    <div>
                        <label class="text-[9px] font-black text-emerald-400 uppercase ml-4 mb-2 block">Listing
                            Title</label>
                        <input type="text" name="title" placeholder="e.g. 3 Bedroom Semi-Detached" required
                            class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-white placeholder:text-slate-500">
                    </div>

                    <div>
                        <label class="text-[9px] font-black text-emerald-400 uppercase ml-4 mb-2 block">Price
                            (Naira)</label>
                        <input type="number" name="price" placeholder="50000000" required
                            class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-white placeholder:text-slate-500">
                    </div>

                    <div>
                        <label class="text-[9px] font-black text-emerald-400 uppercase ml-4 mb-2 block">Neighborhood /
                            Area</label>
                        <!-- FIXED: Standard text type + Explicit ID -->
                        <input type="text" list="loc-suggestions" name="location_name"
                            placeholder="Type neighborhood name..." required
                            class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-white outline-none focus:border-emerald-500">
                        <datalist id="loc-suggestions">
                            <option value="Maitama">
                            <option value="Asokoro">
                            <option value="Gwarinpa">
                            <option value="Kabusa">
                            <option value="Lekki Phase 1">
                        </datalist>
                    </div>

                    <div>
                        <label class="text-[9px] font-black text-emerald-400 uppercase ml-4 mb-2 block">Category</label>
                        <select name="prop_type"
                            class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-white/70">
                            <option value="land">Plot of Land</option>
                            <option value="house">Completed House</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full premium-gradient text-white py-6 rounded-[2.5rem] font-black shadow-2xl active:scale-95 transition border border-white/10">
                    PUBLISH TO TRUTH-VAULT
                </button>
            </form>
        </div>
    </div>

    <!-- Bottom App Navigation -->
    <div
        class="fixed bottom-0 left-0 right-0 glass-card px-10 py-5 flex justify-between items-center z-[100] border-t border-slate-100 rounded-t-[2.5rem] shadow-2xl">
        <div class="flex flex-col items-center text-indigo-600"><i class="fa-solid fa-house-chimney text-2xl"></i></div>
        <div id="addPropTrigger"
            class="flex flex-col items-center text-slate-300 hover:text-indigo-600 cursor-pointer transition">
            <i class="fa-solid fa-circle-plus text-3xl"></i>
            <span class="text-[8px] font-black mt-1 uppercase tracking-tighter">Add Prop</span>
        </div>
        <div class="flex flex-col items-center text-slate-300"><i class="fa-solid fa-gears text-2xl"></i></div>
    </div>

    <script src="/static/js/realtor_portal.js?v=1.2.0" type="module"></script>
</body>

</html>

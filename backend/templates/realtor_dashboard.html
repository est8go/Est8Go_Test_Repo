<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Est8Go | Realtor Executive Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC;
        }

        .premium-indigo {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        .glass-dock {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .nav-active {
            color: #4f46e5;
            transform: translateY(-5px);
        }

        .force-truncate {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .status-dot {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="pb-32">

    <!-- 1. EXECUTIVE HEADER -->
    <nav class="premium-indigo text-white pt-8 pb-14 px-6 rounded-b-[3rem] shadow-2xl sticky top-0 z-50">
        <div class="flex justify-between items-start">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full status-dot"></span>
                    <p class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-indigo-300">Command Center</p>
                </div>
                <h1 id="bizName" class="text-2xl font-black tracking-tighter italic">Bravieshomz <span
                        class="text-indigo-400">Ltd.</span></h1>
            </div>
            <div class="bg-white/10 p-3 rounded-2xl border border-white/10 shadow-inner">
                <i class="fa-solid fa-tower-broadcast text-indigo-200"></i>
            </div>
        </div>
    </nav>

    <!-- 2. THE PIPELINE STATS -->
    <div class="px-6 -mt-10 relative z-50">
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-[2.5rem] shadow-xl border border-white">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Active DMs</p>
                <h3 id="statCount" class="text-2xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-indigo-600 p-5 rounded-[2.5rem] shadow-xl border-indigo-500">
                <p class="text-[9px] font-black text-indigo-200 uppercase tracking-widest">Pipeline Val</p>
                <h3 class="text-2xl font-black text-white">₦450M</h3>
            </div>
        </div>
    </div>

    <!-- 3. MAIN COMMAND AREA (TABBED) -->
    <main class="px-6 mt-10">

        <!-- SECTION: PULSE (Leads & Ticker) -->
        <div id="tab-pulse" class="tab-content active space-y-6">
            <h2 class="text-lg font-black text-slate-800">Live DM Pulse</h2>
            <div id="leadList" class="space-y-4"></div>
        </div>

        <!-- SECTION: VAULT (My Inventory & Truth Score) -->
        <div id="tab-vault" class="tab-content space-y-6">
            <h2 class="text-lg font-black text-slate-800">Property Vault</h2>
            <div id="inventoryList" class="space-y-4"></div>
        </div>

        <!-- SECTION: STUDIO (Social Media Control) -->
        <div id="tab-studio" class="tab-content space-y-6">
            <div class="bg-slate-900 rounded-[2.5rem] p-8 text-center text-white border-4 border-indigo-500/20">
                <i class="fa-solid fa-clapperboard text-4xl mb-4 text-indigo-400"></i>
                <h3 class="text-xl font-black mb-2">Est8Go Studio</h3>
                <p class="text-slate-400 text-sm leading-relaxed mb-6">Create high-energy Reels with trending music from
                    your site photos.</p>
                <button class="w-full bg-indigo-600 py-4 rounded-2xl font-black text-sm uppercase">Launch Video
                    Engine</button>
            </div>
        </div>

        <!-- SECTION: NETWORK (Referrals) -->
        <div id="tab-network" class="tab-content space-y-6">
            <div class="bg-emerald-50 p-6 rounded-[2.5rem] border border-emerald-100">
                <h3 class="font-black text-emerald-900 mb-1">Referral Network</h3>
                <p class="text-xs text-emerald-700 font-bold mb-4">Earn split-commissions by referring Est8Go partners.
                </p>
                <div id="networkList" class="space-y-3"></div>
            </div>
        </div>

    </main>

    <!-- 4. UPLOAD MODAL (Restored) -->
    <div id="uploadModal" class="fixed inset-0 z-[200] hidden bg-slate-900/98 backdrop-blur-2xl flex flex-col">
        <nav class="p-8 flex justify-between items-center text-white">
            <h2 class="text-2xl font-black">List <span class="text-emerald-400">Property</span></h2>
            <button id="closeModal" class="text-4xl text-white/30">&times;</button>
        </nav>
        <div class="flex-1 overflow-y-auto px-8 pb-32">
            <form id="uploadForm" class="space-y-8">
                <div class="bg-white/5 p-8 rounded-[2.5rem] border border-white/10 text-center">
                    <button type="button" id="gpsBtn"
                        class="w-full bg-emerald-500 text-white py-5 rounded-2xl font-black shadow-xl">CAPTURE SITE
                        GPS</button>
                    <input type="hidden" id="latitude" name="latitude"><input type="hidden" id="longitude"
                        name="longitude">
                </div>
                <div class="space-y-4">
                    <input type="text" name="title" placeholder="Listing Title" required
                        class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 text-white">
                    <input type="number" name="price" placeholder="Price (Naira)" required
                        class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 text-white">
                    <input list="locs" name="location_name" placeholder="Area" required
                        class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 text-white">
                    <datalist id="locs">
                        <option value="Maitama">
                        <option value="Asokoro">
                    </datalist>
                    <select name="prop_type"
                        class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 text-white">
                        <option value="land">Land</option>
                        <option value="house">House</option>
                    </select>
                    <input type="file" name="images" multiple required class="w-full text-white/30 text-xs">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-6 rounded-[2.5rem] font-black">PUBLISH
                    TO VAULT</button>
            </form>
        </div>
    </div>

    <!-- 5. EXECUTIVE NAVIGATION DOCK -->
    <div
        class="fixed bottom-6 left-6 right-6 glass-dock h-20 rounded-[2.5rem] shadow-2xl border border-white/50 flex justify-around items-center px-4 z-[100]">
        <button onclick="RealtorPortal.switchTab('pulse')" id="nav-pulse"
            class="flex flex-col items-center gap-1 transition active:scale-90 nav-active">
            <i class="fa-solid fa-wave-square text-xl"></i><span class="text-[8px] font-black uppercase">Pulse</span>
        </button>
        <button onclick="RealtorPortal.switchTab('vault')" id="nav-vault"
            class="flex flex-col items-center gap-1 transition active:scale-90 text-slate-400">
            <i class="fa-solid fa-vault text-xl"></i><span class="text-[8px] font-black uppercase">Vault</span>
        </button>
        <div id="addPropTrigger"
            class="w-14 h-14 premium-indigo rounded-full flex items-center justify-center shadow-lg -mt-12 border-4 border-white active:scale-90 transition">
            <i class="fa-solid fa-plus text-white text-xl"></i>
        </div>
        <button onclick="RealtorPortal.switchTab('studio')" id="nav-studio"
            class="flex flex-col items-center gap-1 transition active:scale-90 text-slate-400">
            <i class="fa-solid fa-wand-magic-sparkles text-xl"></i><span
                class="text-[8px] font-black uppercase">Studio</span>
        </button>
        <button onclick="RealtorPortal.switchTab('network')" id="nav-network"
            class="flex flex-col items-center gap-1 transition active:scale-90 text-slate-400">
            <i class="fa-solid fa-diagram-project text-xl"></i><span
                class="text-[8px] font-black uppercase">Network</span>
        </button>
    </div>

    <script src="/static/js/realtor_portal.js?v=2.0.0" type="module"></script>
</body>

</html>

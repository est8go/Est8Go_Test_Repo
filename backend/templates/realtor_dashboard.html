<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Est8Go | Realtor Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC;
        }

        .premium-gradient {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="pb-24">

    <!-- NAVIGATION (Kept from your beautiful design) -->
    <nav class="premium-gradient text-white pt-6 pb-12 px-6 rounded-b-[2.5rem] shadow-2xl sticky top-0 z-50">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black">Est8Go <span class="text-indigo-400">Realtor</span></h1>
            <div class="bg-white/10 p-3 rounded-2xl"><i class="fa-solid fa-shield-halved"></i></div>
        </div>
    </nav>

    <!-- CONTENT AREA -->
    <main class="px-4 mt-8">
        <div id="leadList" class="space-y-4"></div>
    </main>

    <!-- BOTTOM BAR (Clean ID for JS Hook) -->
    <div class="fixed bottom-0 left-0 right-0 glass-card px-8 py-4 flex justify-between items-center z-[100]">
        <div class="flex flex-col items-center text-indigo-600"><i class="fa-solid fa-house-chimney"></i></div>

        <!-- THE MODULAR HOOK ID: addPropTrigger -->
        <div id="addPropTrigger" class="flex flex-col items-center text-slate-400 cursor-pointer">
            <i class="fa-solid fa-plus-circle text-xl"></i>
            <span class="text-[9px] font-bold mt-1 uppercase">Add Prop</span>
        </div>

        <div class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-gear"></i></div>
    </div>

    <!-- MODULAR JS: The Clean Way -->
    <script src="/static/js/realtor_portal.js" type="module"></script>
</body>

</html>
